plugins {
    id 'com.android.application'
}

android {
    namespace 'com.meetin.chat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.meetin.chat'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Juice (libjuice) for ICE/STUN NAT traversal
    // Note: libjuice is a C library, we need to build and include the JNI bindings
    // For now, we'll implement the ICE logic in Java
}
